<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Onion Dash</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b021a; /* Dark violet background */
            touch-action: none;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #110526, #2d0b59);
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.3);
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #00ffcc;
            animation: glow 1.5s infinite alternate;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        button {
            pointer-events: auto;
            background: linear-gradient(to bottom, #8b5cf6, #6d28d9);
            border: 4px solid #fff;
            color: #fff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.1s;
            text-transform: uppercase;
        }

        button:active {
            transform: scale(0.95);
            background: linear-gradient(to bottom, #6d28d9, #4c1d95);
        }

        #scoreBoard {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            color: #00ffcc;
            text-shadow: 2px 2px 0px #000;
        }
        
        #levelDisplay {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            color: #ff00ff;
            text-shadow: 2px 2px 0px #000;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; transform: scale(1); }
            to { text-shadow: 0 0 20px #00ffcc, 0 0 30px #00ffcc; transform: scale(1.05); }
        }

        #debugPanel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 2, 26, 0.9);
            border: 2px solid #00ffcc;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1000;
            font-size: 0.8rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            pointer-events: auto;
        }

        #debugPanel button, #debugPanel select {
            background: #2d0b59;
            color: #fff;
            border: 1px solid #00ffcc;
            padding: 5px 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: none;
        }

        #debugPanel label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #debugPanel input[type="range"] {
            width: 150px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 0.8rem; padding: 0 20px; }
            button { padding: 10px 20px; font-size: 1rem; }
            #scoreBoard, #levelDisplay { font-size: 1rem; }
            #debugPanel { flex-wrap: wrap; justify-content: center; bottom: 5px; font-size: 0.6rem; }
        }
    </style>
</head>

<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="uiLayer">
            <div id="startScreen">
                <h1>ONION DASH</h1>
                <p>Tap or Space to Jump!<br>Avoid the spikes!</p>
                <button id="startBtn">Play</button>
            </div>
            <div id="gameOverScreen" class="hidden">
                <h1 style="color: #ff0055;">CRASHED!</h1>
                <p id="finalScore">Score: 0</p>
                <button id="restartBtn">Try Again</button>
            </div>
            <div id="levelCompleteScreen" class="hidden">
                <h1 style="color: #00ffcc;">LEVEL CLEARED!</h1>
                <p>Get ready for the next run!</p>
                <button id="nextLevelBtn">Next Level</button>
            </div>
        </div>
        <div id="scoreBoard" class="hidden">0%</div>
        <div id="levelDisplay" class="hidden">Lv 1</div>
        
        <div id="debugPanel" class="hidden">
            <select id="debugLevelSelect"></select>
            <label draggable="true" data-type="0"><input type="radio" name="obstacleType" value="0" checked> Empty</label>
            <label draggable="true" data-type="1"><input type="radio" name="obstacleType" value="1"> Spike</label>
            <label draggable="true" data-type="2"><input type="radio" name="obstacleType" value="2"> Block</label>
            <label draggable="true" data-type="3"><input type="radio" name="obstacleType" value="3"> Down Spike</label>
            <button id="debugPauseBtn">Pause</button>
            <input type="range" id="debugScroll" min="0" max="3000" value="0">
            <button id="debugSaveBtn">Export JSON</button>
        </div>
    </div>

                const clickY = e.clientY - rect.top;
                
                const spacing = 40;
                let colFloor = Math.floor((clickX - canvas.width + distance) / spacing);
                
                let yFromGround = canvas.height - groundHeight - clickY;
                let rFromBottom = Math.floor(yFromGround / 40);
                let row = 4 - rFromBottom;
                
                if (colFloor >= 0 && row >= 0 && row <= 4) {
                    const layout = levels[currentLevel - 1];
                    for (let i = 0; i < 5; i++) {

                            layout[i].push(0);

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (gameState === 'MENU') {
                player.y = canvas.height - groundHeight - player.height;
                drawBackground();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function createParticles(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 1) * 10,
                    size: Math.random() * 5 + 2,
                    color: color,
                    life: 1.0
                });
            }
        }

        function buildLevel() {
            obstacles = [];
            const layout = levels[(currentLevel - 1) % levels.length];
            let currentX = canvas.width;
            const spacing = 40; // Dense spacing for 2D grid
            
            levelLength = layout[0].length * spacing;

            for (let r = 0; r < 5; r++) {
                const rowArray = layout[r];
                rowArray.forEach((type, col) => {
                    let base_x = currentX + (col * spacing) - distance;
                    let base_y = canvas.height - groundHeight - ((5 - r) * 40);
                    if (type === 1) {
                        // Spike rests on the floor of the cell
                        obstacles.push({
                            type: 'spike',
                            x: base_x + 5,
                            y: base_y + 10,
                            width: 30,
                            height: 30
                        });
                    } else if (type === 2) {
                        // Block takes up full 40x40
                        obstacles.push({
                            type: 'block',
                            x: base_x,
                            y: base_y,
                            width: 40,
                            height: 40
                        });
                    } else if (type === 3) {
                        // Down Spike hangs from the ceiling of the cell
                        obstacles.push({
                            type: 'spike-down',
                            x: base_x + 5,
                            y: base_y,
                            width: 30,
                            height: 30
                        });
                    }
                });
            }
        }

        function resetGame() {
            player.y = canvas.height - groundHeight - player.height;
            player.vy = 0;
            player.rotation = 0;
            distance = 0;
            scrollSpeed = baseScrollSpeed + (currentLevel * 0.5);
            particles = [];
            buildLevel();
            
            scoreBoard.innerText = "0%";
            levelDisplay.innerText = "Lv " + currentLevel;
            scoreBoard.classList.remove('hidden');
            levelDisplay.classList.remove('hidden');
        }

        function jump() {
            if (gameState !== 'PLAYING') return;
            if (player.isGrounded) {
                player.vy = jumpForce;
                player.isGrounded = false;
                createParticles(player.x + player.width/2, player.y + player.height, '#00ffcc');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
            if (isDebug && gameState === 'PAUSED') {
                if (e.code === 'ArrowRight') {
                    distance += 50;
                    debugScroll.value = distance;
                    buildLevel();
                } else if (e.code === 'ArrowLeft') {
                    distance -= 50;
                    if (distance < 0) distance = 0;
                    debugScroll.value = distance;
                    buildLevel();
                }
            }
        });
        window.addEventListener('touchstart', jump, {passive: false});
        // We only jump on document mousedown if we aren't clicking the debug UI or paused
        window.addEventListener('mousedown', (e) => {
            if (isDebug && (gameState === 'PAUSED' || e.target.closest('#debugPanel'))) {
                return;
            }
            jump();
        });

        startBtn.addEventListener('click', () => {
            currentLevel = 1;
            startGame();
        });
        
        restartBtn.addEventListener('click', startGame);
        
        nextLevelBtn.addEventListener('click', () => {
            currentLevel++;
            startGame();
        });

        function startGame() {
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            levelCompleteScreen.classList.add('hidden');
            resetGame();
            
            if (typeof gtag !== 'undefined') {
                gtag('event', 'game_start', { 'game_name': 'Onion Dash' });
            }
            
            lastTime = performance.now();
            cancelAnimationFrame(animationId);
            gameLoop(lastTime);
        }

        function drawBackground() {
            // Grid lines
            ctx.strokeStyle = 'rgba(139, 92, 246, 0.2)';
            ctx.lineWidth = 2;
            
            const gridSize = 50;
            const offsetX = -(distance * 0.5) % gridSize;
            
            ctx.beginPath();
            for (let x = offsetX; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Ground
            ctx.fillStyle = '#0b021a';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - groundHeight);
            ctx.lineTo(canvas.width, canvas.height - groundHeight);
            ctx.stroke();
            
            // Ground grid movement
            const gOffsetX = -distance % gridSize;
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = gOffsetX; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, canvas.height - groundHeight);
                ctx.lineTo(x - 50, canvas.height); // slight angle
            }
            ctx.stroke();
        }

        function checkCollision(r1, r2) {
            // Shrink hitboxes slightly for fairer gameplay
            const hitboxShrink = 6;
            return !(r1.x + hitboxShrink > r2.x + r2.width - hitboxShrink || 
                     r1.x + r1.width - hitboxShrink < r2.x + hitboxShrink || 
                     r1.y + hitboxShrink > r2.y + r2.height - hitboxShrink ||
                     r1.y + r1.height - hitboxShrink < r2.y + hitboxShrink);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            createParticles(player.x + player.width/2, player.y + player.height/2, '#ff0055');
            createParticles(player.x + player.width/2, player.y + player.height/2, '#ffffff');
            
            setTimeout(() => {
                scoreBoard.classList.add('hidden');
                levelDisplay.classList.add('hidden');
                let pct = Math.floor((distance / levelLength) * 100);
                finalScoreEl.innerText = `Progress: ${pct}%`;
                gameOverScreen.classList.remove('hidden');
            }, 500);
            
            if (typeof gtag !== 'undefined') {
                gtag('event', 'game_over', { 'game_name': 'Onion Dash' });
            }
        }

        function levelComplete() {
            gameState = 'LEVEL_COMPLETE';
            scoreBoard.classList.add('hidden');
            levelDisplay.classList.add('hidden');
            levelCompleteScreen.classList.remove('hidden');
        }

        function gameLoop(timestamp) {
            if (gameState === 'MENU') {
                drawBackground();
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            const dt = (timestamp - lastTime) / 16.67; // Normalize to 60fps
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            if (gameState === 'PLAYING') {
                // Update Distance
                distance += scrollSpeed * dt;
                let pct = Math.min(100, Math.floor((distance / levelLength) * 100));
                scoreBoard.innerText = `${pct}%`;

                if (distance > levelLength + canvas.width) {
                    levelComplete();
                }

                // Update Player
                player.vy += gravity * dt;
                player.y += player.vy * dt;

                // Floor collision
                if (player.y + player.height >= canvas.height - groundHeight) {
                    player.y = canvas.height - groundHeight - player.height;
                    player.vy = 0;
                    if (!player.isGrounded) {
                        // Just landed
                        player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                    }
                    player.isGrounded = true;
                } else {
                    player.isGrounded = false;
                    player.rotation += 0.1 * dt;
                }

                // Update Obstacles
                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.x -= scrollSpeed * dt;

                    // Platform collision for blocks
                    if (obs.type === 'block') {
                        // Check if landing on top
                        let prevBottom = player.y + player.height - (player.vy * dt);
                        if (player.vy >= 0 && 
                            prevBottom <= obs.y + 10 && 
                            player.x + player.width > obs.x + 2 && 
                            player.x < obs.x + obs.width - 2) {
                            
                            if (player.y + player.height >= obs.y) {
                                player.y = obs.y - player.height;
                                player.vy = 0;
                                player.isGrounded = true;
                                player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                            }
                        }

                    if (checkCollision(player, obs)) {
                        if (obs.type === 'spike' || obs.type === 'spike-down') {
                            gameOver();
                        } else if (obs.type === 'block') {
                            // Side or bottom crash
                            gameOver();
                        }
                    }
                }
            }

                const spacing = 40;
                const layout = levels[currentLevel - 1];
                let maxIndex = Math.max(layout[0].length + 5, Math.ceil((distance + canvas.width) / spacing));
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1;
                
                for (let col = 0; col <= maxIndex; col++) {
                    let slotX = canvas.width + (col * spacing) - distance;
                    if (slotX > -50 && slotX < canvas.width + 50) {
                        for (let row = 0; row < 5; row++) {
                            let slotY = canvas.height - groundHeight - ((5 - row) * 40);
                            ctx.strokeRect(slotX, slotY, 40, 40);
                        }
                    }
                }
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.font = '8px "Press Start 2P"';
                ctx.textAlign = 'center';
                for (let col = 0; col <= maxIndex; col++) {
                    let slotX = canvas.width + (col * spacing) - distance;
                    if (slotX > -50 && slotX < canvas.width + 50) {
                        if (col % 5 === 0) { 
                            ctx.fillText(col, slotX + 20, canvas.height - groundHeight + 15);
                        }
                    }
                }

                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width/2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.lineTo(obs.x, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Neon outline
                    ctx.strokeStyle = '#ffb3cc';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (obs.type === 'spike-down') {
                    ctx.fillStyle = '#ff0055';

                    ctx.moveTo(obs.x + obs.width/2, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width, obs.y);
                    ctx.lineTo(obs.x, obs.y);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Neon outline
                    ctx.strokeStyle = '#ffb3cc';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (obs.type === 'block') {
                    ctx.fillStyle = '#6d28d9';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    
                    // Neon outline
                    ctx.strokeStyle = '#00ffcc';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                }
            });

            // Draw Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 0.05 * dt;
                if(p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            // Draw Player
            if (gameState !== 'GAMEOVER') {
                ctx.save();
                ctx.translate(player.x + player.width/2, player.y + player.height/2);
                ctx.rotate(player.rotation);
                if (playerImageLoaded) {
                    ctx.drawImage(playerImage, -player.width/2, -player.height/2, player.width, player.height);
                } else {
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
                }
                ctx.restore();
            }

            animationId = requestAnimationFrame(gameLoop);
        }
        
        // Initial draw
        drawBackground();
        animationId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
