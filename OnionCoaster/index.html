    <style>
        :root {
            --ink: #2d1b4e;
            --ink-soft: #6b5a88;
            --panel: rgba(255, 255, 255, 0.94);
            --panel-edge: rgba(45, 27, 78, 0.12);
            --purple: #7c3aed;
            --purple-dark: #5b21b6;
            --gold: #f5a524;
            --gold-light: #ffd56b;
            --green: #22b55e;
            --red: #ef4444;
            --sky: #38bdf8;
            --shadow: 0 6px 22px rgba(45, 27, 78, 0.22);
            --radius: 18px;
            --safe-b: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: var(--ink); background: #9ed8ff;
            touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
        }
        button { font-family: inherit; color: inherit; }
        #app { position: fixed; inset: 0; }
        #app canvas { display: block; width: 100%; height: 100%; }
        .hidden { display: none !important; }
        .panel {
            background: var(--panel); border: 1px solid var(--panel-edge); border-radius: var(--radius);
            box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .btn {
            border: none; cursor: pointer; border-radius: 14px; padding: 8px 14px; font-size: 15px; font-weight: 600;
            background: #efe9fb; color: var(--ink); transition: transform .08s ease, background .15s ease, box-shadow .15s;
            display: inline-flex; align-items: center; gap: 6px; justify-content: center; line-height: 1.1;
        }
        .btn:hover { background: #e2d7fa; }
        .btn:active { transform: scale(0.95); }
        .btn.primary { background: var(--purple); color: #fff; box-shadow: 0 3px 0 var(--purple-dark); }
        .btn.primary:hover { background: #8b5cf6; }
        .btn.gold { background: var(--gold); color: #3b2300; box-shadow: 0 3px 0 #c27c06; }
        .btn.green { background: var(--green); color: #fff; box-shadow: 0 3px 0 #15803d; }
        .btn.red { background: var(--red); color: #fff; box-shadow: 0 3px 0 #b91c1c; }
        .btn.on { background: var(--purple); color: #fff; }
        .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
        .btn.small { padding: 5px 10px; font-size: 13px; border-radius: 11px; }
        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* ---------- top bar ---------- */
        #topbar { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; z-index: 5; }
        #topbar > * { pointer-events: auto; }
        #park-stats { display: flex; gap: 4px; padding: 6px 8px; align-items: center; }
        .stat { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; white-space: nowrap; }
        .stat:hover { background: #f1ecfb; }
        .stat .ico { font-size: 18px; }
        #stat-money.neg { color: var(--red); }
        #clock-box { display: flex; gap: 6px; padding: 6px 8px; align-items: center; }
        #clock { font-weight: 600; font-size: 15px; padding: 0 6px; white-space: nowrap; min-width: 112px; text-align: center; }
        .speed-btn { width: 38px; height: 34px; padding: 0; font-size: 14px; }

        /* ---------- bottom toolbar ---------- */
        #toolbar {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--safe-b)); z-index: 5;
            display: flex; gap: 4px; padding: 6px; max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar { display: none; }
        .tool-btn {
            flex: 0 0 auto; width: 74px; height: 64px; border: none; border-radius: 14px; background: transparent; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600;
            transition: background .15s, transform .08s;
        }
        .tool-btn .ico { font-size: 27px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.12)); }
        .tool-btn:hover { background: #f1ecfb; }
        .tool-btn:active { transform: scale(0.94); }
        .tool-btn.on { background: var(--purple); color: #fff; }

        /* ---------- palette (items of a category) ---------- */
        #palette {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + var(--safe-b)); z-index: 5;
            width: min(980px, calc(100vw - 20px)); padding: 10px 12px 12px;
        }
        #palette-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
        #palette-title { font-weight: 700; font-size: 18px; }
        #palette-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
        #palette-items { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
        .card {
            flex: 0 0 auto; width: 112px; border-radius: 14px; background: #f6f2fd; border: 2px solid transparent; cursor: pointer;
            padding: 6px 6px 7px; text-align: center; transition: transform .1s, border-color .15s, background .15s; position: relative;
        }
        .card:hover { transform: translateY(-3px); background: #efe8fd; }
        .card.on { border-color: var(--purple); background: #ece3ff; }
        .card .thumb { width: 100%; height: 70px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; background: linear-gradient(#bfe6ff, #e9f7ff); overflow: hidden; }
        .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .card .nm { font-size: 13px; font-weight: 600; margin-top: 4px; line-height: 1.15; min-height: 30px; display: flex; align-items: center; justify-content: center; }
        .card .pr { font-size: 12px; color: var(--green); font-weight: 600; }
        .card .tag { position: absolute; top: 4px; right: 4px; font-size: 10px; background: var(--gold); color: #3b2300; border-radius: 8px; padding: 1px 6px; font-weight: 700; }
        .card.locked { opacity: 0.45; }

        /* ---------- tool options strip ---------- */
        #tool-opts { position: fixed; left: 50%; transform: translateX(-50%); z-index: 6; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 20px); }
        #tool-opts .lbl { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
        #hint { position: fixed; left: 50%; transform: translateX(-50%); top: 64px; z-index: 6; padding: 7px 14px; font-weight: 600; font-size: 14px; pointer-events: none; text-align: center; max-width: calc(100vw - 30px); }

        /* ---------- info panel ---------- */
        #info { position: fixed; right: 10px; top: 64px; width: 330px; max-height: calc(100vh - 180px); overflow: auto; z-index: 6; padding: 12px 14px; scrollbar-width: thin; }
        #info h2 { margin: 0; font-size: 20px; line-height: 1.15; }
        #info .sub { color: var(--ink-soft); font-size: 13px; margin: 2px 0 8px; }
        #info .x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; padding: 0; border-radius: 50%; }
        .bars { display: grid; grid-template-columns: 92px 1fr 34px; gap: 4px 8px; align-items: center; font-size: 13px; margin: 6px 0; }
        .bar { height: 10px; border-radius: 6px; background: #eee8f7; overflow: hidden; }
        .bar > i { display: block; height: 100%; border-radius: 6px; }
        .kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 14px; margin: 6px 0; }
        .kv b { font-weight: 600; text-align: right; }
        .sect { font-weight: 700; font-size: 14px; margin: 12px 0 4px; color: var(--purple-dark); }
        .thoughts { font-size: 13px; line-height: 1.5; }
        .swatches { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0; }
        .sw { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #0002; cursor: pointer; }
        .sw.on { box-shadow: 0 0 0 3px var(--purple); }
        .stepper { display: inline-flex; align-items: center; gap: 6px; }
        .stepper b { min-width: 46px; text-align: center; }

        /* ---------- coaster builder ---------- */
        #builder { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--safe-b)); z-index: 7; width: min(1040px, calc(100vw - 20px)); padding: 10px 12px; }
        #builder-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        #builder-title { font-weight: 700; font-size: 18px; }
        #builder-status { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
        #builder-pieces { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; }
        .piece {
            flex: 0 0 auto; width: 78px; height: 74px; border-radius: 14px; border: 2px solid transparent; background: #f3eefc; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; line-height: 1.1; text-align: center; padding: 3px;
        }
        .piece svg { width: 40px; height: 34px; }
        .piece:hover { background: #ebe2fd; border-color: #c9b6f5; }
        .piece:active { transform: scale(0.95); }
        .piece.bad { opacity: 0.35; }
        .piece.special { background: #fff4dc; }
        .piece.special:hover { background: #ffe9b8; border-color: #f5c66b; }
        #builder-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

        /* ---------- toasts ---------- */
        #toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
        .toast { padding: 9px 16px; font-weight: 600; font-size: 15px; animation: toastIn .3s ease-out; pointer-events: auto; cursor: pointer; max-width: calc(100vw - 30px); text-align: center; }
        .toast.bad { background: #fff1f1; color: #9b1c1c; }
        .toast.good { background: #effcf3; color: #146c34; }
        @keyframes toastIn { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }

        /* ---------- POV ---------- */
        #pov { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
        #pov .hud { position: absolute; left: 14px; bottom: calc(14px + var(--safe-b)); padding: 10px 14px; font-weight: 600; pointer-events: auto; min-width: 170px; }
        #pov .hud .big { font-size: 30px; line-height: 1; }
        #pov .exit { position: absolute; right: 14px; top: 14px; pointer-events: auto; }
        #pov .tip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 12px; font-size: 13px; pointer-events: none; }

        /* ---------- menus / modals ---------- */
        #menu { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(30,10,60,.15), rgba(30,10,60,.55)); }
        #menu-card { width: min(520px, calc(100vw - 30px)); padding: 26px 26px 22px; text-align: center; }
        #menu-title { font-size: 54px; font-weight: 700; margin: 0; line-height: 1; letter-spacing: -1px;
            background: linear-gradient(180deg, #ffcf4a, #f08c00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #7a3c00); }
        #menu-sub { color: var(--ink-soft); margin: 8px 0 18px; font-size: 16px; }
        #menu-btns { display: flex; flex-direction: column; gap: 10px; }
        #menu-btns .btn { font-size: 19px; padding: 13px; }
        .menu-row { display: flex; gap: 10px; }
        .menu-row .btn { flex: 1; }
        #modal-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(30, 10, 60, 0.35); }
        #modal { width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow: auto; padding: 18px 20px; }
        #modal h2 { margin: 0 0 8px; }
        .keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 14px; }
        .keys kbd { background: #efe9fb; border-radius: 6px; padding: 1px 7px; font-family: inherit; font-weight: 600; border-bottom: 2px solid #d4c8ef; white-space: nowrap; }
        .slot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: #f6f2fd; margin: 6px 0; }
        .goal { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; background: #f6f2fd; margin: 4px 0; font-size: 14px; }
        .goal.done { background: #e7f9ee; }
        canvas.chart { width: 100%; height: 120px; display: block; }
        #tooltip { position: fixed; z-index: 50; pointer-events: none; padding: 5px 10px; font-size: 13px; font-weight: 500; max-width: 260px; }
        #loading { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: #9ed8ff; font-size: 22px; font-weight: 600; }
        #loading .onion { font-size: 64px; animation: bob 0.8s ease-in-out infinite alternate; }
        @keyframes bob { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-16px) rotate(6deg); } }

        @media (max-width: 700px) {
            .tool-btn { width: 60px; height: 56px; font-size: 10.5px; }
            .tool-btn .ico { font-size: 23px; }
            #palette { bottom: calc(80px + var(--safe-b)); }
            .card { width: 96px; }
            .card .thumb { height: 56px; font-size: 32px; }
            #info { left: 10px; right: 10px; width: auto; top: auto; bottom: calc(80px + var(--safe-b)); max-height: 46vh; }
            .stat { font-size: 13px; padding: 3px 6px; }
            .stat .ico { font-size: 15px; }
            #clock { min-width: 0; font-size: 12px; }
            .speed-btn { width: 30px; height: 30px; font-size: 12px; }
            #topbar { flex-wrap: wrap; gap: 6px; top: calc(6px + env(safe-area-inset-top, 0px)); left: 6px; right: 6px; }
            #clock-box { margin-left: auto; padding: 4px 6px; gap: 4px; }
            #park-stats { padding: 4px; }
            #hint, #toasts { top: 104px; }
            #info { max-height: 40vh; }
            #menu-title { font-size: 42px; }
            .piece { width: 66px; height: 66px; font-size: 10.5px; }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="loading"><div class="onion">🧅</div><div>Growing onions…</div></div>

    <div id="topbar" class="hidden">
        <div id="park-stats" class="panel">
            <div class="stat" id="stat-money" title="Money"><span class="ico">💰</span><span class="v">$0</span></div>

        <div id="palette-items"></div>

        <div id="builder-head">
            <div><div id="builder-title">Coaster Builder</div><div id="builder-status"></div></div>

    <script type="importmap">
        { "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        } }
    </script>
    <script type="module">
        // =====================================================================
        //  CORE — shared helpers every other section builds on
        // =====================================================================
        import * as THREE from 'three';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

        const TILE = 4;                       // one grid tile = 4 m (1 unit = 1 m everywhere)
        const TAU = Math.PI * 2;
        const DEG = Math.PI / 180;
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        const lerp = (a, b, t) => a + (b - a) * t;
        const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
        const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
        const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        // live world state models may read: ENV.night 0 (day) → 1 (night), ENV.time = seconds since start
        const ENV = { night: 0, time: 0 };
        const wrapAngle = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

        // 0→1 spin-up over `up` s, hold, then 1→0 over the last `down` s of a ride cycle
        function rideEnvelope(t, cycle, up = 4, down = 4) {
            return smoothstep(0, up, t) * (1 - smoothstep(cycle - down, cycle, t));
        }

        // ---------- materials (cached: identical looks share one material) ----------
        const LIGHT_MATS = [];                // emissive bulb/neon materials — the day/night cycle brightens them
        const _mats = new Map();
        function mat(color, o = {}) {
            const r = o.r ?? 0.75, m = o.m ?? 0, op = o.o ?? 1;
            const key = `${color}|${r}|${m}|${o.e ?? ''}|${o.ei ?? 1}|${op}|${o.side ? 1 : 0}|${o.flat ? 1 : 0}`;
            let M = _mats.get(key);
            if (!M) {
                M = new THREE.MeshStandardMaterial({ color, roughness: r, metalness: m, flatShading: !!o.flat });
                if (o.e != null) { M.emissive.set(o.e); M.emissiveIntensity = o.ei ?? 1; }
                if (op < 1) { M.transparent = true; M.opacity = op; M.depthWrite = false; }
                if (o.side) M.side = THREE.DoubleSide;
                _mats.set(key, M);
            }
            return M;
        }
        // a light bulb / neon tube: dim by day, glowing at night
        function lightMat(color) {
            const key = 'L|' + color;

            const all = [...Array(d.stationLen).fill({ k: 'stn' }), ...recs];
            for (let n = 0; n < all.length; n++) {

                if (!sh) return 'This design doesn\'t fit together';
                const pc = { rec: all[n], sh, a: st, b: stepState(st, all[n]) };

                <div class="row" id="np-land"><button class="btn on" data-v="starter">🎡 A starter park</button><button class="btn" data-v="empty">🌱 Empty land</button></div>
                <div class="sect">Park name</div>
                <input id="np-name" value="${pick(['Onion Land', 'Bulb Bay', 'Sprout Kingdom', 'Shallot Shores', 'Leek Lagoon', 'Chive Island', 'Peel Point'])}" maxlength="24" style="font-family:inherit;font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid #ddd3f3;width:100%">
                <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="np-cancel">Cancel</button><button class="btn primary" id="np-go">Let's go! 🎢</button></div>`;
            openModal(h);
            const sel = { mode: 'sandbox', land: 'starter' };
            for (const grpId of ['np-mode', 'np-land']) for (const b of $(grpId).children) b.onclick = () => { SFX.click(); for (const o of $(grpId).children) o.classList.remove('on'); b.classList.add('on'); sel[grpId === 'np-mode' ? 'mode' : 'land'] = b.dataset.v; };
            $('np-cancel').onclick = () => { SFX.click(); closeModal(); };
            $('np-go').onclick = () => {
                SFX.click();
                closeModal();
                startNewPark(sel.mode, sel.land, $('np-name').value.trim() || 'Onion Park');
            };
        }
        function startNewPark(mode, land, name) {
            clearWorld();
            park.mode = mode; park.name = name;
            park.money = mode === 'career' ? 30000 : 0;
            park.entryFee = mode === 'career' ? 10 : 0;
            park.breakdowns = mode === 'career';
            park.nextId = 1;
            setupGoals([]);
            if (land === 'starter') buildStarterPark(mode);
            else {
                layPath(ENTRANCE_I, N - 2, ENTRANCE_I, N - 6, 1);
                // a few trees around the edges
                const keys = ['oak', 'pine', 'birch'].filter((k) => SCENERY[k]);
                _seed = 77;
                for (let k = 0; k < 200 && keys.length; k++) { const i = 2 + Math.floor(srand() * (N - 4)), j = 2 + Math.floor(srand() * (N - 4)); if ((i < 10 || j < 10 || i > N - 11 || j > N - 11) && !paths.has(tkey(i, j))) addScenery(pick(keys), tileX(i), tileZ(j), srand() * TAU, 0.8 + srand() * 0.4); }
                camFocus(ENTRANCE_X, HALF - 40, 80);
            }
            park.day = 1; park.hour = 9;
            if (land === 'starter') prepopulate(Math.round(targetGuests() * 0.55));
            startGame();
            gtag('event', 'game_start', { game_name: 'Onion Coaster', mode, land });
            if (mode === 'career') setTimeout(() => toast('🏆 Career: build rides, keep your onions happy and finish the goals (📊 Park)!', 'good'), 800);
            else setTimeout(() => toast('🎨 Sandbox: everything is free. Build anything you like!', 'good'), 800);
            saveTo('auto');
        }
        function startGame() {
            gameStarted = true;
            $('menu').classList.add('hidden');
            $('topbar').classList.remove('hidden');
            $('toolbar').classList.remove('hidden');
            buildToolbar();
            setSpeed(1);
            applySettings();
            try { if (!localStorage.getItem('oc-helped')) { localStorage.setItem('oc-helped', '1'); setTimeout(showHelp, 600); } } catch (e) { }
        }
        function openMenu() {
            const m = $('menu');
            m.classList.remove('hidden');
            const box = $('menu-btns');
            box.innerHTML = '';
            const auto = readSave('auto');
            const btn = (label, cls, fn) => { const b = el('button', 'btn ' + cls, label); b.onclick = () => { SFX.init(); SFX.click(); fn(); }; box.appendChild(b); return b; };
            if (gameStarted) {
                btn('▶ Keep playing', 'primary', () => { m.classList.add('hidden'); });
                btn('💾 Save park', '', () => slotsModal('save'));
            } else if (auto) {
                btn(`▶ Continue: ${auto.name}`, 'primary', () => { loadPark(auto); startGame(); m.classList.add('hidden'); });
            } else {
                // first visit: the starter park behind the menu is ready to go
                btn('▶ Play!', 'primary', () => { park.name = park.name === 'Onion Park' ? 'Onion Land' : park.name; startGame(); m.classList.add('hidden'); saveTo('auto'); gtag('event', 'game_start', { game_name: 'Onion Coaster', mode: 'sandbox', land: 'starter-quick' }); setTimeout(() => toast('🎨 Sandbox: everything is free. Build anything you like!', 'good'), 800); });
            }
            btn('🧅 New park', gameStarted || auto ? 'gold' : 'primary', newParkFlow);
            btn('📂 Load a park', '', () => slotsModal('load'));
            const row = el('div', 'menu-row');
            const b1 = el('button', 'btn', '❓ How to play'); b1.onclick = () => { SFX.click(); showHelp(); };
            const b2 = el('button', 'btn', '⚙️ Settings'); b2.onclick = () => { SFX.click(); settingsModal(); };
            row.append(b1, b2); box.appendChild(row);
            if (gameStarted) setSpeed(park.paused ? 0 : park.speed);
        }
        function slotsModal(kind) {
            let h = `<h2>${kind === 'save' ? '💾 Save your park' : '📂 Load a park'}</h2>`;
            const slots = ['auto', '1', '2', '3'];
            for (const s of slots) {
                if (kind === 'save' && s === 'auto') continue;
                const d = readSave(s);
                const label = s === 'auto' ? 'Autosave' : `Slot ${s}`;
                h += `<div class="slot"><div><b>${label}</b><br><span class="sub" style="margin:0">${d ? `${d.name} · Day ${d.day} · ${d.mode === 'career' ? 'Career' : 'Sandbox'} · ${new Date(d.savedAt).toLocaleString()}` : 'Empty'}</span></div>`;
                h += kind === 'save' ? `<button class="btn primary small" data-slot="${s}">Save here</button>` : d ? `<button class="btn primary small" data-slot="${s}">Load</button>` : '';
                h += '</div>';
            }
            h += `<div class="row" style="justify-content:flex-end"><button class="btn" id="sl-close">Close</button></div>`;
            openModal(h);
            $('sl-close').onclick = () => { SFX.click(); closeModal(); };
            for (const b of $('modal').querySelectorAll('[data-slot]')) b.onclick = () => {
                SFX.click();
                const s = b.dataset.slot;
                if (kind === 'save') { if (saveTo(s)) { toast('💾 Saved!', 'good'); SFX.ding(); } else toast('Could not save (storage full?)', 'bad'); closeModal(); }
                else { const d = readSave(s); if (d) { loadPark(d); closeModal(); if (!gameStarted) startGame(); $('menu').classList.add('hidden'); toast(`📂 Welcome back to ${d.name}!`, 'good'); } }
            };
        }
        function settingsModal() {
            const q = settings.quality;
            openModal(`<h2>⚙️ Settings</h2>
                <div class="sect">Sound</div><div class="row"><button class="btn ${settings.sound ? 'on' : ''}" id="se-snd">🔊 Sound effects</button><button class="btn ${settings.music ? 'on' : ''}" id="se-mus">🎵 Music</button></div>
                <div class="sect">Graphics</div><div class="row" id="se-q">${['auto', 'low', 'medium', 'high'].map((k) => `<button class="btn ${q === k ? 'on' : ''}" data-q="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>
                <div class="sub" style="margin-top:6px">Low graphics = faster on older computers and tablets.</div>
                <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="se-done">Done</button></div>`);
            $('se-snd').onclick = () => { settings.sound = !settings.sound; applySettings(); saveSettings(); settingsModal(); };
            $('se-mus').onclick = () => { settings.music = !settings.music; applySettings(); saveSettings(); settingsModal(); };
            for (const b of $('se-q').children) b.onclick = () => { settings.quality = b.dataset.q; if (b.dataset.q === 'auto') setQuality(IS_TOUCH || SMALL_SCREEN ? 1 : 2); applySettings(); saveSettings(); settingsModal(); };
            $('se-done').onclick = () => { SFX.click(); closeModal(); };
        }
        function showHelp() {
            openModal(`<h2>❓ How to play Onion Coaster</h2>
                <p>Build a theme park for onions! Put down <b>paths</b>, add <b>rides</b>, <b>coasters</b>, <b>water slides</b>, <b>snacks</b> and <b>scenery</b>. Onions arrive at the gate, ride your rides, eat, swim and (hopefully) have the best day ever.</p>
                <div class="sect">Moving around</div>
                <div class="keys">
                    <kbd>W A S D</kbd><span>or arrow keys — move the camera (drag the ground works too)</span>
                    <kbd>Q / E</kbd><span>spin the camera (or right-drag)</span>
                    <kbd>Mouse wheel</kbd><span>zoom in and out (Z / X too)</span>
                    <kbd>Two fingers</kbd><span>on a tablet: pinch to zoom, twist to spin</span>
                </div>
                <div class="sect">Building</div>
                <div class="keys">
                    <kbd>R</kbd><span>turn the thing you're placing</span>
                    <kbd>F</kbd><span>flip which side a coaster's entrance is on</span>
                    <kbd>PgUp / PgDn</kbd><span>make a path into a bridge, higher or lower</span>
                    <kbd>B</kbd><span>bulldozer</span>
                    <kbd>Esc</kbd><span>cancel / close</span>
                    <kbd>Space</kbd><span>pause · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> game speed</span>
                </div>
                <div class="sect">Coaster tips</div>
                <p style="margin:0">🎢 Place a <b>station</b>, then add pieces one at a time. Turn on <b>⛓️ Chain lift</b> to climb hills. When you get stuck, press <b>✨ Auto-finish</b> and it'll find a way back to the station! Then <b>Test</b> and <b>Open</b> it. Click any ride and press <b>👀 Ride it!</b> to ride along.</p>
                <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="hp-ok">Got it!</button></div>`);
            $('hp-ok').onclick = () => { SFX.click(); closeModal(); };
        }

        // ---------- the loop ----------
        const SEC_PER_HOUR = 10;          // one game day = 4 minutes
        let last = performance.now(), simTime = 0, ratingT = 0, autosaveT = 0, menuSpin = 0;
        function newDay() {
            park.day++;
            const d = park.cash.day;
            if (!isSandbox()) {
                const wages = park.staff.reduce((s, x) => s + STAFF[x.role].wage, 0);
                const upkeep = Math.round(park.rides.reduce((s, r) => s + (r.kind === 'track' ? r.cost * 0.006 : r.def.cost * 0.01), 0) + park.shops.length * 8);
                park.money -= wages + upkeep;
                d.wages -= wages; d.upkeep -= upkeep;
                const total = d.entry + d.rides + d.shops + d.build + d.wages + d.upkeep;
                toast(`🌅 Day ${park.day}! Yesterday you ${total >= 0 ? 'made' : 'spent'} $${fmt(Math.abs(total))}`, total >= 0 ? 'good' : '');
            }
            park.cash.history.push(d);
            if (park.cash.history.length > 30) park.cash.history.shift();
            park.cash.day = newLedger();
        }
        function simStep(dt) {
            simTime += dt;
            ENV.time = simTime;
            park.hour += dt / SEC_PER_HOUR;
            if (park.hour >= 24) { park.hour -= 24; newDay(); }
            for (const r of park.rides) {
                if (r.kind === 'track') {
                    if (r.status === 'open' || r.status === 'testing' || (r.status === 'closed' && r.train && r.train.mode !== 'load') || (pov && pov.ride === r)) r.update(dt);
                    rideOperate(r, dt);
                } else r.update(dt);
            }
            spawnGuests(dt);
            for (let k = guests.length - 1; k >= 0; k--) {
                const g = guests[k];
                guestUpdate(g, dt);
                if (g.dead) { hideBubble(g); guests.splice(k, 1); }
            }
            for (const s of park.staff) staffUpdate(s, dt);
            ratingT += dt;
            if (ratingT > 2) {
                ratingT = 0;
                park.rating = computeRating();
                if (gameStarted) checkGoals();
            }
            park.ratingSmooth += (park.rating - park.ratingSmooth) * Math.min(1, dt * 0.15);
        }
        const _focus = new THREE.Vector3();
        let waterT = 0;
        // ?debug=1 → a little performance overlay (ms per section, draw calls)
        const PERF = { on: new URLSearchParams(location.search).has('debug'), acc: {}, n: 0, el: null, t: 0 };
        const pmark = (k, t0) => { if (PERF.on) PERF.acc[k] = (PERF.acc[k] || 0) + performance.now() - t0; };
        function perfOverlay(rawDt) {
            if (!PERF.on) return;
            if (!PERF.el) { PERF.el = el('div', 'panel', ''); Object.assign(PERF.el.style, { position: 'fixed', left: '10px', top: '70px', zIndex: 50, padding: '6px 10px', font: '12px monospace', whiteSpace: 'pre', pointerEvents: 'none' }); document.body.appendChild(PERF.el); }
            PERF.n++; PERF.t += rawDt;
            if (PERF.t < 1) return;
            const i = renderer.info.render;
            PERF.el.textContent = `fps ${(PERF.n / PERF.t).toFixed(1)}\n` + Object.entries(PERF.acc).map(([k, v]) => `${k.padEnd(8)} ${(v / PERF.n).toFixed(2)} ms`).join('\n') + `\ncalls ${i.calls}  tris ${(i.triangles / 1000).toFixed(0)}k\nonions ${renderStats.onions}/${guests.length}  dpr ${renderer.getPixelRatio()}  q${quality.level}`;
            PERF.acc = {}; PERF.n = 0; PERF.t = 0;
        }
        function frame(now) {
            requestAnimationFrame(frame);
            const rawDt = Math.min(0.1, (now - last) / 1000);
            last = now;
            let _t0 = performance.now();
            if (gameStarted && !park.paused) {
                let remain = rawDt * park.speed;
                while (remain > 1e-6) { const h = Math.min(remain, 1 / 30); simStep(h); remain -= h; }
                pmark('sim', _t0); _t0 = performance.now();
            } else if (!gameStarted) {
                // title screen: the park keeps living behind the menu
                simStep(rawDt);
                menuSpin += rawDt * 0.05;
                cam.yaw = 0.55 + menuSpin; cam.dist = 105; cam.pitch = 0.62;
            }
            terrainStep(rawDt);
            if (terrainDirty) refreshTerrain();
            if (pathsDirty) rebuildPaths();
            if (poolsDirty) rebuildPools();
            if (litterDirty) refreshLitter();
            updateSceneryPools();
            if (followGuest) {
                if (followGuest.dead || drag || keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD) followGuest = null;
                else { cam.tx = followGuest.x; cam.tz = followGuest.z; cam.dist = Math.min(cam.dist, 30); }
            }
            if (povActive && pov) updatePOV(rawDt); else updateCameraRig(rawDt);
            _focus.set(povActive ? camera.position.x : camS.tx, 0, povActive ? camera.position.z : camS.tz);
            applyTimeOfDay(park.hour, _focus);
            sky.position.copy(camera.position);
            skyU.uTime.value = now / 1000;
            waterT += rawDt;
            waterNormals.offset.set(waterT * 0.012, waterT * 0.008);
            flowWaterTex.offset.y = -waterT * 0.9;
            if (hoverDirty || (tool && tool.kind === 'terrain')) { hoverDirty = false; previewTool(); }
            pmark('world', _t0); _t0 = performance.now();
            renderOnions(now / 1000);
            pmark('onions', _t0); _t0 = performance.now();
            updateFloaters(rawDt);
            if (FW.active) FW.update(rawDt);
            processThumbs();
            infoTimer += rawDt;
            if (infoObj && infoTimer > 0.5 && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#info'))) { infoTimer = 0; if (!$('info').matches(':hover') || infoObj.thoughts) renderInfo(); }
            updateTopbar();
            updateAudio(rawDt);
            autoQuality(rawDt);
            if (gameStarted) { autosaveT += rawDt; if (autosaveT > 45) { autosaveT = 0; saveTo('auto'); } }
            pmark('ui+audio', _t0); _t0 = performance.now();
            renderer.render(scene, camera);
            pmark('render', _t0);
            perfOverlay(rawDt);
        }
        function updateAudio(dt) {
            if (!SFX.ready) return;
            // park ambience: how many onions are near the camera, night, pools nearby
            let crowd = 0, nearWater = 0;
            const cx = camS.tx, cz = camS.tz, rr = 30 + cam.dist * 0.4;
            for (let k = 0; k < guests.length; k += 3) { const g = guests[k]; if (Math.abs(g.x - cx) < rr && Math.abs(g.z - cz) < rr) crowd++; }
            for (const t of poolTiles.values()) if (Math.abs(tileX(t.i) - cx) < rr && Math.abs(tileZ(t.j) - cz) < rr) nearWater++;
            const zoomFade = clamp(1.3 - cam.dist / 180, 0.25, 1);
            SFX.setAmbience(clamp(crowd / 25, 0, 1) * zoomFade, ENV.night, clamp(nearWater / 12, 0, 1) * zoomFade);
            if (povActive) return;
            // the loudest coaster near the camera target
            let best = null, bv = 0;
            for (const r of park.rides) {
                if (r.kind !== 'track' || !r.train || r.train.mode === 'load') continue;
                r.frameAt(r.train.l, _v1);
                const d = Math.hypot(_v1.x - camera.position.x, _v1.y - camera.position.y, _v1.z - camera.position.z);
                const v = clamp(1 - d / 110, 0, 1);
                if (v > bv) { bv = v; best = r; }
            }
            if (best) {
                SFX.setCoaster(Math.abs(best.train.v), bv * 0.8);
                SFX.setChain(!!(best.flagAt(best.train.l) & 1) && best.train.v > 0.5, bv);
            } else { SFX.setCoaster(0, 0); SFX.setChain(false, 0); }
        }

        // ---------- boot ----------
        if (FLAT_RIDES.topspin) FLAT_RIDES.topspin.name = 'Onion Flipper';   // "Onion Twister" is the big coaster
        function boot() {
            refreshPaintTex();
            refreshTerrain();
            buildOuterWorld();
            buildParkEntrance();
            setQuality(quality.level);
            const auto = readSave('auto');
            if (auto) { try { loadPark(auto); } catch (e) { console.warn('autosave broken', e); clearWorld(); buildStarterPark('sandbox'); } }
            else { park.mode = 'sandbox'; setupGoals([]); buildStarterPark('sandbox'); prepopulate(Math.round(targetGuests() * 0.55)); }
            // let the starter park fill up a bit before anyone looks at it
            for (let k = 0; k < 90; k++) simStep(1 / 3);
            $('loading').classList.add('hidden');
            openMenu();
            window.__ocReady = true;
            requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
        }
        document.addEventListener('visibilitychange', () => { if (document.hidden && gameStarted) saveTo('auto'); });
        addEventListener('pagehide', () => { if (gameStarted) saveTo('auto'); });

        // hidden handle for testing from the console
        window.__oc = {
            park, guests, paths, ground, trackOcc, poolTiles, scene, renderer, camera, cam, quality, SFX, BLUEPRINTS,
            step(dt = 1 / 30, n = 1) { for (let k = 0; k < n; k++) simStep(dt); },
            render() { renderOnions(performance.now() / 1000); renderer.render(scene, camera); },
            startNewPark, saveTo, readSave, loadPark, serializePark, placeBlueprintNear, buildBlueprint, placeFlatRide, placeShop, addScenery, hireStaff,
            openInfo, startPOV, endPOV, setTool, openCat, openBuilder, closeBuilder, runTest, startFireworks, autoComplete, computeRating,
            get pov() { return pov; }, get builder() { return builder; }, get tool() { return tool; },
            THREE, tileX, tileZ, toTile, TILE, N, terrainY,
            get lastBpErr() { return lastBpErr; },
            canFlat(key, i0, j0, r) { return canPlaceFlat(FLAT_RIDES[key], i0, j0, r) || 'OK'; },
            probeBP(name, i, j, r, side = 1) { const bp = BLUEPRINTS.find((b) => b.name === name); return canPlaceStation(bp.type, i, j, r, side) || probeLayout(bp.type, bpStart(bp, i, j, r), bpRecs(bp), bpGateTiles(bp, i, j, r, side)) || 'OK'; },
            // test helper: click the canvas where a world point appears on screen
            clickAt(x, y, z, opts = {}) {
                const v = new THREE.Vector3(x, y, z).project(camera);
                const cx = (v.x + 1) / 2 * innerWidth, cy = (1 - v.y) / 2 * innerHeight;
                const base = { clientX: cx, clientY: cy, pointerId: 7, button: opts.button || 0, bubbles: true, pointerType: 'mouse' };
                cvs.dispatchEvent(new PointerEvent('pointerdown', base));
                if (opts.toX != null) { const w = new THREE.Vector3(opts.toX, y, opts.toZ).project(camera); for (let k = 1; k <= 6; k++) cvs.dispatchEvent(new PointerEvent('pointermove', { ...base, clientX: cx + ((w.x + 1) / 2 * innerWidth - cx) * k / 6, clientY: cy + ((1 - w.y) / 2 * innerHeight - cy) * k / 6 })); }
                cvs.dispatchEvent(new PointerEvent('pointerup', base));
                return [cx, cy];
            },
            pressButton(text) { const b = [...document.querySelectorAll('button, .card, .piece')].find((e) => e.offsetParent && e.textContent.includes(text)); if (b) b.click(); return !!b; },
        };
        boot();
    </script>
